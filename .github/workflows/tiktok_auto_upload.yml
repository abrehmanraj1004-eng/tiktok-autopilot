name: TikTok 24/7 Auto-Pilot (Shorts to TikTok)

on:
  repository_dispatch:
    types: [tiktok_auto_upload]
  workflow_dispatch:
    inputs:
      test_upload_private:
        description: 'Upload 1 old video as PRIVATE to test end-to-end'
        required: false
        type: boolean
        default: false
      test_login:
        description: 'Verify TikTok login & cookies in cloud browser'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (download & 61s test without TikTok upload)'
        required: false
        type: boolean
        default: false
      instant_check:
        description: 'Check once immediately without waiting in 10-min loop'
        required: false
        type: boolean
        default: false
  schedule:
    # 19:55 UTC = 12:55 AM PKT (catches 01:00 AM Short)
    # 15:55 UTC = 08:55 PM PKT (catches 09:00 PM Short)
    # 17:55 UTC = 10:55 PM PKT (catches 11:00 PM Short)
    - cron: '55 15,17,19 * * *'

permissions:
  contents: write

jobs:
  check-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: Run Cloud Uploader Bot
        env:
          YOUTUBE_CHANNEL_URL: 'https://www.youtube.com/@OtakuMedia1/shorts'
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          MAX_WAIT_MINUTES: 15
          POLL_INTERVAL_SECONDS: 5
          DRY_RUN: ${{ inputs.dry_run }}
          INSTANT: ${{ inputs.instant_check }}
          TEST_LOGIN: ${{ inputs.test_login }}
          TEST_UPLOAD_PRIVATE: ${{ inputs.test_upload_private }}
        run: |
          ARGS=""
          if [ "$TEST_UPLOAD_PRIVATE" = "true" ]; then
            ARGS="$ARGS --test-upload-private"
          elif [ "$TEST_LOGIN" = "true" ]; then
            ARGS="$ARGS --test-login"
          elif [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$INSTANT" = "true" ]; then
            ARGS="$ARGS --instant"
          fi
          python cloud_uploader.py $ARGS

      - name: Upload Browser Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-browser-screenshots
          path: |
            workspace/screenshots/*.png
            workspace/*.png

      - name: Commit Updated History
        run: |
          git config --global user.name "TikTok-AutoPilot-Bot"
          git config --global user.email "bot@github-actions.local"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-record uploaded shorts [skip ci]" && git push)
